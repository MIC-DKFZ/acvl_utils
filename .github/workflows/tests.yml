name: Tests

# Run the unit tests on every push to master and on every pull request.
#
# publish.yml calls this workflow as well (workflow_call), so a version tag is
# only uploaded to PyPI after the tests passed on the tagged commit.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest Python nnU-Net supports. Recent torch and blosc2
        # need 3.11+, so 3.10 also tests the older versions pip resolves there.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install acvl_utils and its dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU build of torch: the default wheel brings several GB of CUDA
          # libraries that the tests do not need
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
